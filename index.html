<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>貯金アプリ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>

<h1>💰 貯金目標</h1>

<div>
  <input id="title" placeholder="目標タイトル">
  <input id="goal" type="number" min="1" placeholder="目標金額">
  <input id="saved" type="number" placeholder="現在の貯金額">

  <button class="add-goal-btn" onclick="addGoal()">追加</button>
</div>


<div class="backup-buttons">
  <button class="backup-btn" onclick="exportGoals()">📤 バックアップを保存</button>
  <button class="backup-btn" onclick="document.getElementById('importFile').click()">📥 バックアップを読み込む</button>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importGoals(event)">
</div>

<h2>目標一覧</h2>

<div id="goalList"></div>


<script src="script.js"></script>

</body>
</html>
